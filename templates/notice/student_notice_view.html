{% extends 'base.html' %}

{% block title %}{{ notice.title }} - Hostel Management{% endblock %}

{% block content %}
<div class="content-container">
    <div class="page-header">
        <h2>Notice</h2>
        <a href="{% url 'notice:student_notice_list' %}" class="btn btn-secondary">Back to Notices</a>
    </div>

    <div class="card">
        <div class="notice-header">
            <h3>{{ notice.title }}</h3>
            <span class="notice-date">{{ notice.date }}</span>
        </div>

        <div class="notice-content">
            {{ notice.description|linebreaks }}
        </div>
    </div>
</div>
{% endblock %}
